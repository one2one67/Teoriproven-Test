<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#f03e3e" stroke-width="8" />
  <!-- Left car: Red (overtaking car) -->
  <g transform="translate(25, 38)">
    <rect x="2" y="10" width="18" height="12" fill="#f03e3e" rx="4" />
    <rect x="5" y="5" width="12" height="6" fill="#adb5bd" rx="2" />
    <!-- wheels -->
    <rect x="0" y="20" width="4" height="4" fill="#000000" />
    <rect x="18" y="20" width="4" height="4" fill="#000000" />
  </g>
  <!-- Right car: Black (normal vehicle) -->
  <g transform="translate(53, 38)">
    <rect x="2" y="10" width="18" height="12" fill="#212529" rx="4" />
    <rect x="5" y="5" width="12" height="6" fill="#adb5bd" rx="2" />
    <!-- wheels -->
    <rect x="0" y="20" width="4" height="4" fill="#000000" />
    <rect x="18" y="20" width="4" height="4" fill="#000000" />
  </g>
</svg>
