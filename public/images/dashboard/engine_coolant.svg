<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000000" rx="10" />
  <!-- Red Thermometer with waves -->
  <g fill="none" stroke="#fa5252" stroke-width="4" stroke-linecap="round">
    <!-- Thermometer stem and bulb -->
    <path d="M 50,22 L 50,55 A 8,8 0 1 0 54,62 L 54,22 Z" fill="#fa5252" stroke-width="1" />
    <!-- Level lines -->
    <line x1="58" y1="30" x2="63" y2="30" stroke-width="3" />
    <line x1="58" y1="38" x2="63" y2="38" stroke-width="3" />
    <line x1="58" y1="46" x2="63" y2="46" stroke-width="3" />
    <!-- Liquid level bulb indicator -->
    <circle cx="50" cy="62" r="5" fill="#fa5252" stroke="none" />
    <!-- Waves underneath -->
    <path d="M 25,75 C 30,73 35,77 40,75 C 45,73 50,77 55,75 C 60,73 65,77 70,75 C 75,73 80,77 85,75" stroke-width="3" />
    <path d="M 25,83 C 30,81 35,85 40,83 C 45,81 50,85 55,83 C 60,81 65,85 70,83 C 75,81 80,85 85,83" stroke-width="3" />
  </g>
</svg>
